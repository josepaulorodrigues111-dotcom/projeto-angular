
name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_KEY;

          if (!url || !key) {
            throw new Error(
              'Faltam os GitHub Secrets SUPABASE_URL ou SUPABASE_KEY.'
            );
          }

          const environment = {
            production: true,
            supabaseUrl: url,
            supabaseKey: key
          };

          const content =
            'export const environment = ' +
            JSON.stringify(environment, null, 2) +
            ';\n';

          fs.writeFileSync(
            'src/environments/environment.ts',
            content
          );

          console.log('Ficheiro de ambiente de produção configurado.');
          NODE

      - name: Build Angular Project
        run: npm run build -- --configuration production --base-href "/projeto-angular/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/shop-manager/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
