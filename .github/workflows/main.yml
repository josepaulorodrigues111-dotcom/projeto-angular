name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_KEY;

          if (!url || !key) {
            throw new Error(
              'Faltam os GitHub Secrets SUPABASE_URL ou SUPABASE_KEY.'
            );
          }

          if (key.startsWith('sb_secret_')) {
            throw new Error(
              'SUPABASE_KEY tem de ser uma chave pública anon/publishable, nunca uma chave secreta.'
            );
          }

          let parsedUrl;

          try {
            parsedUrl = new URL(url);
          } catch {
            throw new Error('SUPABASE_URL não contém um URL válido.');
          }

          if (!['https:', 'http:'].includes(parsedUrl.protocol)) {
            throw new Error('SUPABASE_URL não contém um URL HTTP válido.');
          }

          try {
            const jwtPayload = key.split('.')[1];

            if (jwtPayload) {
              const payload = JSON.parse(
                Buffer.from(jwtPayload, 'base64url').toString('utf8')
              );

              if (payload.role && payload.role !== 'anon') {
                throw new Error(
                  'SUPABASE_KEY tem de ser uma chave pública anon/publishable.'
                );
              }
            }
          } catch (error) {
            if (error.message.includes('SUPABASE_KEY')) {
              throw error;
            }

            throw new Error(
              'Não foi possível validar o formato de SUPABASE_KEY.'
            );
          }

          const environment = {
            production: true,
            supabaseUrl: url,
            supabaseKey: key
          };

          const content =
            'export const environment = ' +
            JSON.stringify(environment, null, 2) +
            ';\n';

          fs.writeFileSync(
            'src/environments/environment.ts',
            content,
            'utf8'
          );

          console.log('Ficheiro de ambiente de produção configurado.');
          NODE

      - name: Build Angular Project
        run: npx ng build --configuration production --base-href "/projeto-angular/"

      - name: Configure GitHub Pages fallback
        run: cp dist/shop-manager/browser/index.html dist/shop-manager/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/shop-manager/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
