<article class="cartao">
  <div class="imagem-container">
    <img
      [src]="caminhoImagem(produto.thumbnail)"
      [alt]="produto.title"
      loading="lazy"
    />
  </div>

  <h3>{{ produto.title }}</h3>

  <p class="descricao">{{ produto.description }}</p>

  <p class="categoria">
    {{ produto.category | titlecase }}
  </p>

  <p class="preco">
    {{ produto.price | currency: 'EUR' }}
  </p>

  @switch (disponibilidade) {
    @case ('esgotado') {
      <p class="stock esgotado">
        <span class="ponto-stock" aria-hidden="true"></span>
        Esgotado
      </p>
    }
    @case ('poucas') {
      <p class="stock poucas">
        <span class="ponto-stock" aria-hidden="true"></span>
        Apenas {{ produto.stock }} unidades
      </p>
    }
    @default {
      <p class="stock disponivel">
        <span class="ponto-stock" aria-hidden="true"></span>
        Em stock ({{ produto.stock }})
      </p>
    }
  }

  <button
    type="button"
    (click)="verDetalhe.emit(produto)"
    [attr.aria-label]="'Ver detalhes de ' + produto.title"
  >
    Ver detalhes
  </button>
</article>
