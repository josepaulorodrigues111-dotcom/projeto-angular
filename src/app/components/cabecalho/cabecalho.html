<header class="cabecalho">
  <a routerLink="/" class="logo">LojaDos400</a>

  <nav>
    <a routerLink="/">Início</a>
    <a routerLink="/produtos">Produtos</a>

    @if (auth.autenticado()) {
      <a routerLink="/admin" class="admin">Administração</a>

      <button
        type="button"
        class="botao-sair"
        (click)="sair()"
      >
        Sair
      </button>
    } @else {
      <a routerLink="/login">Entrar</a>
    }
  </nav>
</header>
