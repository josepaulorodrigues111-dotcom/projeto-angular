<header class="cabecalho">
  <a routerLink="/" class="logo" aria-label="LojaDos400 - Página inicial">
    <span class="logo-marca">L</span>
    <span>LojaDos400</span>
  </a>

  <nav aria-label="Navegação principal">
    <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
      Início
    </a>

    <a routerLink="/produtos" routerLinkActive="ativo">
      Produtos
    </a>

    @if (auth.eAdmin()) {
      <a routerLink="/admin" routerLinkActive="ativo" class="admin">
        Administração
      </a>
    }
  </nav>

  <div class="acoes-cabecalho">
    <a
      routerLink="/carrinho"
      routerLinkActive="ativo"
      class="carrinho"
      aria-label="Carrinho"
    >
      <svg
        viewBox="0 0 24 24"
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="9" cy="20" r="1.5" />
        <circle cx="18" cy="20" r="1.5" />
        <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6" />
      </svg>

      <span class="texto-carrinho">Carrinho</span>

      @if (carrinho.quantidadeTotal() > 0) {
        <span class="contador">{{ carrinho.quantidadeTotal() }}</span>
      }
    </a>

    @if (auth.autenticado()) {
      <button type="button" class="botao-sair" (click)="sair()">
        Sair
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="ativo" class="botao-entrar">
        Entrar
      </a>
    }
  </div>

  @if (erroSair) {
    <p class="erro-sessao" role="alert">{{ erroSair }}</p>
  }
</header>
