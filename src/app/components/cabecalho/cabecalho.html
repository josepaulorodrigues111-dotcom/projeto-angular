<header class="cabecalho">
  <a routerLink="/" class="logo">LojaDos400</a>

  <nav>
    <a routerLink="/">Início</a>
    <a routerLink="/produtos">Produtos</a>

    <a routerLink="/carrinho" class="carrinho" aria-label="Carrinho">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="20" r="1.5" />
        <circle cx="18" cy="20" r="1.5" />
        <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6" />
      </svg>
      @if (carrinho.quantidadeTotal() > 0) {
        <span class="contador">{{ carrinho.quantidadeTotal() }}</span>
      }
    </a>

    @if (auth.eAdmin()) {
      <a routerLink="/admin" class="admin">Administração</a>
    }

    @if (auth.autenticado()) {
      <button
        type="button"
        class="botao-sair"
        (click)="sair()"
      >
        Sair
      </button>
    } @else {
      <a routerLink="/login">Entrar</a>
    }
  </nav>
  @if (erroSair) {
    <p class="erro-sessao" role="alert">{{ erroSair }}</p>
  }
</header>
